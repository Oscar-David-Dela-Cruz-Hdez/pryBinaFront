<section class="recommendations" *ngIf="loading || recommendations.length">
  <header class="mb-6 pb-4 border-b border-[#E5E5E5] dark:border-[#333333]">
    <div>
      <span class="text-[10px] uppercase tracking-wider text-[#C88A78] dark:text-[#D4AF37] font-normal">Recomendación personalizada</span>
      <h2 class="text-2xl font-serif font-light text-[#111111] dark:text-[#F0F0F0] mt-1">{{ title }}</h2>
    </div>
    <p class="text-xs text-[#666666] dark:text-[#A0A0A0] font-light mt-1">Productos que suelen comprarse junto con tu selección.</p>
  </header>

  <div *ngIf="loading" class="loading text-xs uppercase tracking-wider text-[#666666] dark:text-[#A0A0A0] p-8 text-center">Buscando productos relacionados…</div>

  <div class="recommendation-grid" *ngIf="!loading">
    <article *ngFor="let product of recommendations" class="recommendation-card border border-[#E5E5E5] dark:border-[#333333] bg-white dark:bg-[#1E1E1E] rounded-none shadow-none">
      <a [routerLink]="['/productos', product._id]" class="image-link bg-white dark:bg-[#1E1E1E] p-4 border-r border-[#E5E5E5] dark:border-[#333333]">
        <img [src]="product.imagenUrl || product.imagenUrlPrincipal || 'assets/images/no-image.png'" [alt]="product.nombre" class="object-contain max-h-32">
      </a>
      <div class="card-body p-4 flex flex-col">
        <small class="text-[10px] uppercase tracking-wider text-[#C88A78] dark:text-[#D4AF37] font-normal mb-1">{{ product.motivo || 'Sugerido para ti' }}</small>
        <a [routerLink]="['/productos', product._id]" class="text-sm font-serif font-light text-[#111111] dark:text-[#F0F0F0] leading-snug hover:text-[#C88A78] dark:hover:text-[#D4AF37] transition-all no-underline mb-2">
          {{ product.nombre }}
        </a>
        <strong class="text-sm font-normal text-[#111111] dark:text-[#D4AF37] mb-3">{{ (product.precioNormalFinal || product.precioNormal || product.precio) | currency }}</strong>
        <button type="button" (click)="addToCart(product)"
          class="mt-auto flex items-center justify-center gap-1.5 px-3 py-2 bg-[#111111] dark:bg-[#D4AF37] text-white dark:text-[#111111] border border-[#111111] dark:border-[#D4AF37] rounded-none text-[11px] uppercase tracking-[1px] font-normal hover:bg-white dark:hover:bg-white hover:text-[#111111] dark:hover:text-[#111111] transition-all cursor-pointer">
          <mat-icon class="!text-sm !w-3.5 !h-3.5">add_shopping_cart</mat-icon>
          Agregar
        </button>
      </div>
    </article>
  </div>
</section>
