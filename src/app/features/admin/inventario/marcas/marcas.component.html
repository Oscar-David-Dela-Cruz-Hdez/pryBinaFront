<div class="admin-container w-full max-w-6xl mx-auto p-4 md:p-6 lg:p-8 animate-fade-in transition-all duration-300 min-h-[calc(100vh-80px)]">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 border-b border-[#E5E5E5] dark:border-[#333333] pb-4 gap-4">
    <h2 class="text-3xl font-serif font-light text-[#111111] dark:text-[#F0F0F0]">Gestión de Marcas</h2>
    <button class="px-5 py-2.5 bg-[#111111] text-white border border-[#111111] rounded-none font-normal text-xs uppercase tracking-[1px] hover:bg-white hover:text-[#111111] transition-all cursor-pointer flex items-center gap-2" (click)="toggleForm()">
      <mat-icon>{{ showForm ? 'remove' : 'add' }}</mat-icon>
      {{ showForm ? 'Cancelar' : 'Nueva Marca' }}
    </button>
  </div>

  <!-- Formulario -->
  <mat-card *ngIf="showForm" class="mb-6 bg-[#FFFFFF] dark:bg-[#1E1E1E] rounded-none border border-[#E5E5E5] dark:border-[#333333] shadow-none">
    <mat-card-header class="p-6 pb-0">
      <mat-card-title class="text-xl font-serif font-light text-[#111111] dark:text-[#F0F0F0]">
        {{ isEditing ? 'Editar Marca' : 'Agregar Marca' }}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content class="p-6">
      <form [formGroup]="marcaForm" (ngSubmit)="onSubmit()" class="space-y-5">

        <div class="field-admin">
          <label class="label-admin uppercase tracking-wider text-xs font-normal">Nombre <span class="text-red-500">*</span></label>
          <input type="text" formControlName="nombre" placeholder="Ej: Alfaparf" class="w-full px-3 py-2 bg-white border border-[#E5E5E5] text-sm text-[#111111]">
          <p *ngIf="marcaForm.get('nombre')?.hasError('required') && marcaForm.get('nombre')?.touched" class="text-red-500 text-xs mt-1">El nombre es requerido</p>
        </div>

        <div class="field-admin">
          <label class="label-admin uppercase tracking-wider text-xs font-normal">Descripción</label>
          <textarea formControlName="descripcion" rows="3" placeholder="Descripción de la marca..." class="w-full px-3 py-2 bg-white border border-[#E5E5E5] text-sm text-[#111111]"></textarea>
        </div>

        <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-[#E5E5E5] dark:border-[#333333]">
          <button type="button" class="px-5 py-2.5 bg-white text-[#111111] border border-[#111111] rounded-none font-normal text-xs uppercase tracking-[1px] hover:bg-[#111111] hover:text-white transition-all cursor-pointer" (click)="toggleForm()">Cancelar</button>
          <button type="submit" class="px-5 py-2.5 bg-[#111111] text-white border border-[#111111] rounded-none font-normal text-xs uppercase tracking-[1px] hover:bg-white hover:text-[#111111] disabled:opacity-45 transition-all cursor-pointer" [disabled]="marcaForm.invalid || isLoading">
            {{ isLoading ? 'Guardando...' : (isEditing ? 'Actualizar' : 'Guardar') }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- Tabla de marcas -->
  <div class="admin-data-table" *ngIf="marcas.length > 0; else noData">
    <table>
      <thead>
        <tr class="admin-table-head">
          <th class="admin-th uppercase tracking-wider text-xs font-normal" style="width:48px"></th>
          <th class="admin-th uppercase tracking-wider text-xs font-normal">Nombre</th>
          <th class="admin-th uppercase tracking-wider text-xs font-normal">Descripción</th>
          <th class="admin-th uppercase tracking-wider text-xs font-normal text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of marcas" class="admin-table-row">
          <td class="admin-td">
            <div class="w-8 h-8 border border-[#E5E5E5] flex items-center justify-center text-[#C88A78]">
              <mat-icon style="font-size:18px;width:18px;height:18px">branding_watermark</mat-icon>
            </div>
          </td>
          <td class="admin-td">
            <span class="font-normal text-[#111111] text-sm">{{ m.nombre }}</span>
          </td>
          <td class="admin-td">
            <span class="text-xs text-[#666666] font-light">{{ m.descripcion || '—' }}</span>
          </td>
          <td class="admin-td text-right">
            <button class="text-[#111111] hover:text-[#C88A78] p-1" (click)="editMarca(m)" title="Editar">
              <mat-icon style="font-size:18px;width:18px;height:18px">edit</mat-icon>
            </button>
            <button class="text-red-500 hover:text-red-700 p-1" (click)="deleteMarca(m)" title="Eliminar">
              <mat-icon style="font-size:18px;width:18px;height:18px">delete</mat-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noData>
    <div class="admin-empty-state border border-[#E5E5E5] p-12 text-center bg-white">
      <mat-icon class="text-[#C88A78]">branding_watermark</mat-icon>
      <p class="text-xs uppercase tracking-wider text-[#666666] mt-2">No hay marcas registradas.</p>
    </div>
  </ng-template>
</div>
