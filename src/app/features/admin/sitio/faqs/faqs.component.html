<div class="admin-container w-full max-w-4xl mx-auto p-4 md:p-8 animate-slide-up transition-all duration-300 min-h-[calc(100vh-80px)]">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 border-b border-[#E5E5E5] dark:border-[#333333] pb-4 gap-4">
    <div>
      <h2 class="text-3xl font-serif font-light text-[#111111] dark:text-[#F0F0F0]">Preguntas Frecuentes</h2>
      <p class="text-xs uppercase tracking-wider text-[#666666] dark:text-[#A0A0A0] mt-1">{{ faqs.length }} pregunta(s) registrada(s)</p>
    </div>
    <button class="px-5 py-2.5 bg-[#111111] text-white border border-[#111111] rounded-none font-normal text-xs uppercase tracking-[1px] hover:bg-white hover:text-[#111111] transition-all cursor-pointer flex items-center gap-2" (click)="toggleForm()">
      <mat-icon>{{ showForm ? 'remove' : 'add' }}</mat-icon>
      {{ showForm ? 'Cancelar' : 'Nueva Pregunta' }}
    </button>
  </div>

  <!-- Formulario -->
  <mat-card *ngIf="showForm" class="mb-6 bg-[#FFFFFF] dark:bg-[#1E1E1E] rounded-none border border-[#E5E5E5] dark:border-[#333333] shadow-none">
    <mat-card-header class="p-6 pb-0">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 border border-[#E5E5E5] flex items-center justify-center text-[#C88A78]">
          <mat-icon class="!text-xl">{{ editingId ? 'edit_note' : 'quiz' }}</mat-icon>
        </div>
        <mat-card-title class="text-xl font-serif font-light text-[#111111] dark:text-[#F0F0F0]">
          {{ editingId ? 'Editar Pregunta' : 'Agregar Nueva Pregunta' }}
        </mat-card-title>
      </div>
    </mat-card-header>
    <mat-card-content class="p-6">
      <form [formGroup]="faqForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div class="field-admin">
          <label class="label-admin uppercase tracking-wider text-xs font-normal">Pregunta <span class="text-red-500">*</span></label>
          <input type="text" formControlName="pregunta" placeholder="Ej: ¿Cuáles son los métodos de pago?" class="w-full px-3 py-2 bg-white border border-[#E5E5E5] text-sm text-[#111111]">
        </div>
        <div class="field-admin">
          <label class="label-admin uppercase tracking-wider text-xs font-normal">Respuesta <span class="text-red-500">*</span></label>
          <textarea formControlName="respuesta" rows="4" placeholder="Respuesta detallada..." class="w-full px-3 py-2 bg-white border border-[#E5E5E5] text-sm text-[#111111]"></textarea>
        </div>
        <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-[#E5E5E5] dark:border-[#333333]">
          <button type="button" class="px-5 py-2.5 bg-white text-[#111111] border border-[#111111] rounded-none font-normal text-xs uppercase tracking-[1px] hover:bg-[#111111] hover:text-white transition-all cursor-pointer" (click)="toggleForm()">Cancelar</button>
          <button type="submit" class="px-5 py-2.5 bg-[#111111] text-white border border-[#111111] rounded-none font-normal text-xs uppercase tracking-[1px] hover:bg-white hover:text-[#111111] disabled:opacity-45 transition-all cursor-pointer" [disabled]="faqForm.invalid || isLoading">
            {{ isLoading ? 'Guardando...' : (editingId ? 'Actualizar' : 'Guardar') }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- Lista de FAQs en tarjetas -->
  <div class="space-y-3" *ngIf="faqs.length > 0; else noFaqs">
    <div *ngFor="let faq of faqs; let i = index"
         class="group bg-[#FFFFFF] dark:bg-[#1E1E1E] rounded-none border border-[#E5E5E5] dark:border-[#333333] p-5 flex items-start gap-4">

      <!-- Número -->
      <div class="flex-shrink-0 w-8 h-8 border border-[#E5E5E5] flex items-center justify-center font-serif font-light text-[#C88A78] text-sm">
        {{ i + 1 }}
      </div>

      <!-- Contenido -->
      <div class="flex-1 min-w-0">
        <p class="font-serif font-light text-lg text-[#111111] dark:text-[#F0F0F0] leading-snug mb-2">{{ faq.pregunta }}</p>
        <p class="text-xs text-[#666666] font-light leading-relaxed">{{ faq.respuesta }}</p>
      </div>

      <!-- Acciones -->
      <div class="flex-shrink-0 flex items-center gap-1">
        <button class="text-[#111111] hover:text-[#C88A78] p-1" (click)="editFaq(faq)" title="Editar">
          <mat-icon style="font-size:18px;width:18px;height:18px">edit</mat-icon>
        </button>
        <button class="text-red-500 hover:text-red-700 p-1" (click)="deleteFaq(faq._id)" title="Eliminar">
          <mat-icon style="font-size:18px;width:18px;height:18px">delete</mat-icon>
        </button>
      </div>

    </div>
  </div>

  <!-- Estado vacío -->
  <ng-template #noFaqs>
    <div class="flex flex-col items-center justify-center gap-4 py-16 bg-white rounded-none border border-[#E5E5E5]">
      <div class="w-12 h-12 border border-[#E5E5E5] flex items-center justify-center text-[#C88A78]">
        <mat-icon class="!text-3xl">quiz</mat-icon>
      </div>
      <div class="text-center">
        <p class="font-serif font-light text-lg text-[#111111]">Sin preguntas aún</p>
        <p class="text-xs uppercase tracking-wider text-[#666666] mt-1">Agrega tu primera pregunta frecuente</p>
      </div>
      <button class="px-5 py-2.5 bg-[#111111] text-white border border-[#111111] rounded-none font-normal text-xs uppercase tracking-[1px] hover:bg-white hover:text-[#111111] transition-all cursor-pointer flex items-center gap-2" (click)="toggleForm()">
        <mat-icon>add</mat-icon> Agregar Pregunta
      </button>
    </div>
  </ng-template>
</div>
