<div class="admin-container w-full max-w-4xl mx-auto p-4 md:p-8 animate-slide-up transition-all duration-300 min-h-[calc(100vh-80px)]">
  <div class="mb-8 border-b border-[#E5E5E5] dark:border-[#333333] pb-4">
    <h2 class="text-3xl font-serif font-light text-[#111111] dark:text-[#F0F0F0]">Gestión de Historia</h2>
  </div>
  <mat-card class="bg-[#FFFFFF] dark:bg-[#1E1E1E] rounded-none border border-[#E5E5E5] dark:border-[#333333] shadow-none">
    <mat-card-content class="p-6">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
        <div class="field-admin">
          <label class="label-admin uppercase tracking-wider text-xs font-normal text-[#111111]">Historia de la Empresa</label>
          <textarea formControlName="historia" rows="8" placeholder="Escribe la historia aquí..." class="w-full px-3 py-2 bg-white border border-[#E5E5E5] text-sm text-[#111111] font-light leading-relaxed"></textarea>
        </div>
        <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-[#E5E5E5] dark:border-[#333333]">
          <button type="submit" class="px-5 py-2.5 bg-[#111111] text-white border border-[#111111] rounded-none font-normal text-xs uppercase tracking-[1px] hover:bg-white hover:text-[#111111] disabled:opacity-45 transition-all cursor-pointer" [disabled]="isLoading">
            {{ isLoading ? 'Guardando...' : 'Guardar Cambios' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
