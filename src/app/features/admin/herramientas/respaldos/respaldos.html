<div class="admin-container w-full max-w-6xl mx-auto p-4 md:p-6 lg:p-8 animate-fade-in transition-all duration-300 min-h-[calc(100vh-80px)]">
  <div class="mb-8 border-b border-[#E5E5E5] dark:border-[#333333] pb-4">
    <h2 class="text-3xl font-serif font-light text-[#111111] dark:text-[#F0F0F0]">Respaldos de Base de Datos</h2>
  </div>
  <p class="subtitle-text text-xs uppercase tracking-wider text-[#666666] dark:text-[#A0A0A0] mb-6">Genera copias de seguridad de las colecciones activas del sistema.</p>

  <mat-card class="backup-card bg-white dark:bg-[#1E1E1E] rounded-none border border-[#E5E5E5] dark:border-[#333333] shadow-none overflow-hidden transition-all duration-300">
    <mat-card-header class="p-6 pb-0 flex items-center gap-4">
      <div mat-card-avatar class="header-icon p-3 rounded-full border border-[#E5E5E5] dark:border-[#333333] text-[#C88A78] dark:text-[#E5C158] bg-transparent flex items-center justify-center">
        <mat-icon class="!text-xl !w-5 !h-5 leading-none">save</mat-icon>
      </div>
      <div>
        <mat-card-title class="text-xl font-serif font-light text-[#111111] dark:text-[#F0F0F0]">Colecciones Disponibles</mat-card-title>
        <mat-card-subtitle class="text-xs text-[#666666] dark:text-[#A0A0A0] font-light mt-1">Selecciona los datos que deseas exportar al archivo .zip</mat-card-subtitle>
      </div>
    </mat-card-header>

    <mat-card-content class="p-6 pt-4">
      <div *ngIf="isLoading" class="loading-state flex flex-col items-center justify-center gap-4 py-8">
        <mat-spinner diameter="36" class="text-[#C88A78]"></mat-spinner>
        <span class="text-xs uppercase tracking-wider text-[#666666] dark:text-[#A0A0A0]">Cargando colecciones...</span>
      </div>

      <div *ngIf="!isLoading && colecciones.length === 0" class="empty-state flex flex-col items-center justify-center gap-4 py-8">
        <p class="text-xs uppercase tracking-wider text-[#666666] dark:text-[#A0A0A0]">No se encontraron colecciones disponibles.</p>
        <button (click)="cargarColecciones()"
          class="px-6 py-2.5 bg-white dark:bg-[#2A2A2A] text-[#111111] dark:text-[#F0F0F0] border border-[#111111] dark:border-[#555555] rounded-none text-xs uppercase tracking-[1px] font-normal hover:bg-[#111111] hover:text-white dark:hover:bg-[#333333] transition-all cursor-pointer">
          Reintentar
        </button>
      </div>

      <div *ngIf="!isLoading && colecciones.length > 0" class="collections-list">
        <div class="select-all p-4 border-b border-[#E5E5E5] dark:border-[#333333] mb-4">
          <mat-checkbox
            [checked]="allSelected"
            [indeterminate]="someSelected"
            (change)="toggleAll($event)"
            class="text-[#111111] dark:text-[#F0F0F0]">
            <b class="font-normal text-xs uppercase tracking-wider text-[#111111] dark:text-[#F0F0F0]">Seleccionar Todas</b>
          </mat-checkbox>
        </div>

        <div class="checkbox-grid p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 rounded-none bg-[#FAFAFA] dark:bg-[#141414] border border-[#E5E5E5] dark:border-[#333333] transition-colors duration-300">
          <div *ngFor="let col of colecciones" class="p-2 rounded hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
            <mat-checkbox
              [(ngModel)]="seleccionadas[col]"
              class="text-[#111111] dark:text-[#F0F0F0] text-sm w-full">
              <span class="text-sm text-[#111111] dark:text-[#F0F0F0] font-normal">{{ col }}</span>
            </mat-checkbox>
          </div>
        </div>
      </div>
    </mat-card-content>

    <mat-card-actions class="p-6 pt-0" *ngIf="!isLoading && colecciones.length > 0">
      <button
        (click)="descargarRespaldo()"
        [disabled]="isDownloading"
        class="flex items-center gap-2 px-6 py-3 bg-[#111111] dark:bg-[#C88A78] text-white dark:text-white border border-[#111111] dark:border-[#C88A78] rounded-none text-xs uppercase tracking-[1px] font-medium hover:bg-white hover:text-[#111111] dark:hover:bg-[#b07565] disabled:opacity-45 transition-all cursor-pointer">
        <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">cloud_download</mat-icon>
        <span>{{ isDownloading ? 'Generando ZIP...' : 'Descargar Respaldo' }}</span>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
