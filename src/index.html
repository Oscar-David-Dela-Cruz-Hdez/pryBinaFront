<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Distribuidora Panamericana</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Distribuidora Panamericana - Belleza y Cuidado Personal">
  <meta name="theme-color" content="#111111">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --color-primary: #111111;
      --color-primary-dark: #222222;
      --color-accent: #C88A78;
      --color-text: #111111;
      --color-text-muted: #666666;
      --color-text-dark: #F0F0F0;
      --color-bg: #FFFFFF;
      --color-bg-dark: #121212;
      --color-border: #E5E5E5;
      --color-border-dark: #333333;
    }
    body {
      font-family: 'Montserrat', 'Roboto', sans-serif;
      background-color: #FFFFFF;
      color: #111111;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Cormorant Garamond', 'Montserrat', serif;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body class="bg-[#FFFFFF] dark:bg-[#121212] text-[#111111] dark:text-[#F0F0F0] font-sans antialiased transition-colors duration-300 ease-out">
  <app-root></app-root>
</body>
</html>
